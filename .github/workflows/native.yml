name: Native Android and iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/native.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_PUBLIC_YANDEX_MAPKIT_KEY: ${{ secrets.YANDEX_MAPKIT_KEY }}
      EXPO_PUBLIC_API_URL: https://taxi.example.com/api
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:native
      - run: npx expo prebuild --platform android --no-install
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: taxi-go-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      RCT_NEW_ARCH_ENABLED: '0'
      EXPO_PUBLIC_YANDEX_MAPKIT_KEY: ${{ secrets.YANDEX_MAPKIT_KEY }}
      EXPO_PUBLIC_API_URL: https://taxi.example.com/api
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:native
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --repo-update
        working-directory: mobile/ios
      - run: xcodebuild -workspace ios/TaxiGO.xcworkspace -scheme TaxiGO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: taxi-go-ios-simulator
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/TaxiGO.app
