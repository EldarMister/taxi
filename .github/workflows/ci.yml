name: Server and application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: taxi_ci_only
          POSTGRES_DB: taxi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taxi -d taxi_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: development
      TEST_DATABASE_RESET: 'true'
      DATABASE_URL: postgresql://taxi:taxi_ci_only@127.0.0.1:5432/taxi_test?schema=public
      JWT_SECRET: container-ci-only-jwt-secret-at-least-32-characters
      OTP_SECRET: container-ci-only-otp-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix web
      - name: Hydrate independently pinned current APKs
        env:
          ATLAS_RELEASE_DOWNLOAD_BASE: https://atlas-app.up.railway.app
          ATLAS_RELEASE_PIN_FILE: ${{ github.workspace }}/web/release-downloads.pin.json
        run: node web/scripts/fetch-release-downloads.mjs
      - name: Build and exercise API and website containers
        run: node scripts/verify-container-release.mjs
      - name: Preserve container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-checks-${{ github.sha }}
          path: artifacts/container-checks/
          if-no-files-found: error
          retention-days: 30
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: taxi_ci_only
          POSTGRES_DB: taxi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taxi -d taxi_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://taxi:taxi_ci_only@127.0.0.1:5432/taxi_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      OTP_SECRET: ci-only-otp-secret-at-least-32-characters
      DEV_AUTH_ENABLED: 'true'
      DEV_OTP_CODE: '123456'
      SMS_PROVIDER: development
      ROUTING_PROVIDER: osrm
      PUSH_PROVIDER: development
      TEST_DATABASE_RESET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            mobile/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix mobile
      - run: npm ci --prefix web
      - name: Stage the independently pinned published APK pair
        env:
          ATLAS_RELEASE_DOWNLOAD_BASE: https://atlas-app.up.railway.app
          ATLAS_RELEASE_PIN_FILE: ${{ github.workspace }}/web/release-downloads.pin.json
        run: node web/scripts/fetch-release-downloads.mjs
      - name: Verify disposable database before migration
        run: node --input-type=module -e "import {assertTestDatabase} from './scripts/lib/database-target.mjs'; assertTestDatabase(process.env.DATABASE_URL);"
      - run: npm run db:migrate --prefix server
      - name: Run every mandatory suite for this candidate
        run: node scripts/verify-candidate.mjs
      - name: Preserve candidate evidence even if a required check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-checks-${{ github.sha }}
          path: artifacts/candidate-checks/
          if-no-files-found: error
          retention-days: 30
